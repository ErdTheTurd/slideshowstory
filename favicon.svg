<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Slideshow Story">
  <rect width="32" height="32" fill="#141210"/>
  <!-- film sprocket holes -->
  <rect x="2" y="4" width="3" height="4" rx="0.5" fill="#d4a574" opacity="0.85"/>
  <rect x="2" y="14" width="3" height="4" rx="0.5" fill="#d4a574" opacity="0.85"/>
  <rect x="2" y="24" width="3" height="4" rx="0.5" fill="#d4a574" opacity="0.85"/>
  <rect x="27" y="4" width="3" height="4" rx="0.5" fill="#d4a574" opacity="0.85"/>
  <rect x="27" y="14" width="3" height="4" rx="0.5" fill="#d4a574" opacity="0.85"/>
  <rect x="27" y="24" width="3" height="4" rx="0.5" fill="#d4a574" opacity="0.85"/>
  <!-- title card frame -->
  <rect x="7" y="8" width="18" height="16" fill="none" stroke="#d4a574" stroke-width="1.25"/>
  <!-- serif-ish "S" mark as two strokes suggesting a chapter card -->
  <line x1="11" y1="13" x2="21" y2="13" stroke="#f2ebe0" stroke-width="1"/>
  <text x="16" y="22" text-anchor="middle" fill="#f2ebe0" font-family="Georgia, 'Times New Roman', serif" font-size="9" font-weight="600">S</text>
</svg>
